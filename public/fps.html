*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf0f2;color:#17252d;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start}.brand,.status,.hp{background:#ffffffdc;border:1px solid #d4e0e4;border-radius:12px;padding:10px 14px;box-shadow:0 5px 18px #21343d12}.brand b{letter-spacing:.14em}.brand small{display:block;color:#65767e;font-size:10px;letter-spacing:.16em}.status{font-size:12px}.hp{position:absolute;left:16px;bottom:18px;width:170px}.hp strong{font-size:22px}.bar{height:6px;background:#dbe4e7;border-radius:9px;margin-top:5px}.bar i{display:block;width:100%;height:100%;background:#fa5148;border-radius:9px;transition:width .2s}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.7}.cross:before,.cross:after{content:"";position:absolute;background:#182a31}.cross:before{width:1px;height:18px;left:8px}.cross:after{height:1px;width:18px;top:8px}.controls{position:absolute;right:18px;bottom:20px;display:flex;align-items:end;gap:11px;pointer-events:auto}.btn{border:1px solid #cddadd;background:#ffffffdc;color:#17252d;border-radius:50%;width:62px;height:62px;font-weight:800;font-size:10px;box-shadow:0 7px 18px #182a3120;touch-action:none}.btn.fire{width:88px;height:88px;border:0;background:#f04f47;color:white;font-size:14px}.btn.active{background:#13b8c5;color:white}.hp{top:76px;bottom:auto}#stick{position:absolute;left:22px;bottom:22px;width:116px;height:116px;border:2px solid #ffffffc9;border-radius:50%;background:#243b4428;box-shadow:inset 0 0 0 1px #49616a35;pointer-events:auto;touch-action:none}#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffffd9;border:1px solid #bccbd0;box-shadow:0 4px 12px #18303a35;pointer-events:none}.damage{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#ff4e42;text-shadow:0 2px 4px white,0 0 10px white;pointer-events:none;white-space:nowrap}#hitflash{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);color:#f04f47;font-size:13px;font-weight:900;letter-spacing:.08em;text-shadow:0 1px 4px white;pointer-events:none}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#eaf0f2ee;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #d8e2e5;border-radius:20px;padding:26px;box-shadow:0 20px 70px #1b303522}.card h1{font-size:22px;margin:0 0 4px;letter-spacing:.08em}.card p{color:#697a81;font-size:13px;line-height:1.7}.row{display:flex;gap:8px;margin:12px 0}.row input,.row select{min-width:0;flex:1;padding:13px;border:1px solid #d5e0e3;border-radius:10px;font-size:15px;background:white}.action{padding:13px;border:0;border-radius:10px;background:#172a32;color:white;font-weight:700;cursor:pointer}.action.alt{background:#e9f0f2;color:#172a32}.weapons{display:flex;gap:8px}.weapons button{flex:1;padding:11px 4px;border:1px solid #d5e0e3;border-radius:10px;background:white}.weapons button.sel{border:2px solid #13b8c5}.hint{font-size:11px!important}.gone{display:none!important}
</style></head><body><div id="overlay"><div class="card"><h1>FIELD / 04</h1><p>障害物フィールド・オンライン対戦<br>ホストがルームを作成し、4桁コードを共有してください。</p><div class="row"><input id="name" maxlength="12" placeholder="プレイヤー名" value="PLAYER"><button id="create" class="action">ルーム作成</button></div><div class="row"><input id="code" maxlength="4" inputmode="numeric" placeholder="4桁コード"><button id="join" class="action alt">参加</button></div><div class="weapons"><button data-w="AR" class="sel">AR · 30</button><button data-w="SG">SG · 6</button><button data-w="SR">SR · 5</button></div><p class="hint">左側をドラッグして移動、右側をドラッグして視点操作。射撃・しゃがみ・リロード。キーボード: WASD / マウス / Space。</p><p id="msg"></p></div></div><div id="hud"><div class="top"><div class="brand"><b>FIELD / 04</b><small>TACTICAL TRAINING</small></div><div class="status" id="stat">LOBBY</div></div><div class="cross"></div><div class="hp"><strong id="hp">100</strong> HP <span style="float:right" id="ammo">30 / 30</span><div class="bar"><i id="hbar"></i></div></div><div class="controls"><button id="crouch" class="btn">CROUCH</button><button id="reload" class="btn">RELOAD</button><button id="fire" class="btn fire">FIRE</button></div><div id="stick"><div id="knob"></div></div><div id="hitflash"></div></div>
<script src="/game-config.js"></script><script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const $=s=>document.querySelector(s),socket=io(window.GAME_SERVER_URL||undefined),overlay=$('#overlay');let scene,camera,renderer,clock,me=null,players={},pendingState=null,spawned=false,weapon='AR',hp=100,ammo=30,maxAmmo=30,reloading=false,crouch=false,room='',yaw=0,pitch=0,keys={},joy={x:0,y:0},look=null,fireTimer=0,objs=[],damageFloats=[],dead=false;const specs={AR:{dmg:15,rate:130,mag:30},SG:{dmg:22,rate:780,mag:6,pellets:8},SR:{dmg:100,rate:950,mag:5}};
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{weapon=b.dataset.w;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('sel',x===b));maxAmmo=specs[weapon].mag;ammo=maxAmmo;updateHud()});
function build(){scene=new THREE.Scene();scene.background=new THREE.Color('#dce8eb');scene.fog=new THREE.Fog('#dce8eb',38,100);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.insertBefore(renderer.domElement,document.body.firstChild);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xffffff,0x94a6a9,2));let sun=new THREE.DirectionalLight(0xfff5df,2.3);sun.position.set(-18,28,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(64,64),new THREE.MeshStandardMaterial({color:'#dfe6e3',roughness:.92}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);let grid=new THREE.GridHelper(64,32,0xcbd6d6,0xd2dcdb);grid.position.y=.012;scene.add(grid);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const add=(x,z,w,h,d,c)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);objs.push(m)};add(0,-31,64,2,2,'#c5d3d5');add(0,31,64,2,2,'#c5d3d5');add(-31,0,2,2,64,'#c5d3d5');add(31,0,2,2,64,'#c5d3d5');[[0,0,3,3,3],[ -12,-10,8,2,2],[-5,-13,2,2,8],[10,-12,7,2,2],[15,-6,2,3,8],[4,-5,5,1.2,2],[-17,3,2,3,9],[-10,8,7,2,2],[-3,13,2,3,8],[10,8,8,2,2],[17,15,2,2,7],[5,18,8,1.1,2],[0,-22,2,3,8],[22,0,7,2,2],[-22,18,6,2,2],[20,-20,6,2,2],[0,4,7,1.2,2]].forEach((a,i)=>add(...a,['#c7d3d2','#b9cccf','#e0aa74','#bac3c5'][i%4]));for(let x=-24;x<=24;x+=8)for(let z=-24;z<=24;z+=8){let p=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,2.2,8),mat('#a9b9bb'));p.position.set(x,1.1,z);scene.add(p);objs.push(p)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop)}
function blocked(x,z,r=.42){return objs.some(o=>{const p=o.geometry.parameters,dx=Math.abs(x-o.position.x),dz=Math.abs(z-o.position.z);if(o.geometry.type==='BoxGeometry')return dx<p.width/2+r&&dz<p.depth/2+r;return Math.hypot(dx,dz)<(p.radiusTop||.1)+r})}
function makePlayer(id,data){if(players[id])return players[id];let g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.65,4,8),new THREE.MeshStandardMaterial({color:id===socket.id?'#19b7c4':'#ef574f'}));body.position.y=.75;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),new THREE.MeshStandardMaterial({color:'#f3c4a0'}));head.position.y=1.35;g.add(head);scene.add(g);players[id]=g;return g}
function sync(data){if(!data)return;if(!scene){pendingState=data;return}for(let [id,p] of Object.entries(data)){let g=makePlayer(id,p);if(id===socket.id){me=p;if(!spawned){camera.position.set(p.x,1.65,p.z);spawned=true}}g.position.set(p.x||0,0,p.z||0);g.rotation.y=p.yaw||0;g.children[0].scale.y=p.crouch?.65:1;if(id===socket.id)g.visible=false}for(let id of Object.keys(players))if(!data[id]){scene.remove(players[id]);delete players[id]}if(me){hp=me.hp;$('#hp').textContent=hp;$('#hbar').style.width=hp+'%';dead=hp<=0;$('#stat').textContent=`ROOM ${room}  ·  ${Object.keys(data).length} PLAYERS${dead?'  ·  OUT':''}`}}
function showBullet(d){if(!scene)return;const from=new THREE.Vector3(d.from.x,d.from.y,d.from.z),to=new THREE.Vector3(d.to.x,d.to.y,d.to.z),direction=to.clone().sub(from),length=direction.length();if(length<.08)return;const color=d.weapon==='SR'?0x49efff:d.weapon==='SG'?0xff783e:0xffe45c,geometry=new THREE.CylinderGeometry(.045,.045,length,8),material=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}),beam=new THREE.Mesh(geometry,material);beam.position.copy(from).add(to).multiplyScalar(.5);beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.clone().normalize());beam.renderOrder=5;scene.add(beam);const dot=new THREE.Mesh(new THREE.SphereGeometry(.085,8,8),new THREE.MeshBasicMaterial({color}));dot.position.copy(from);scene.add(dot);const started=performance.now();function moveDot(){const t=Math.min(1,(performance.now()-started)/220);dot.position.lerpVectors(from,to,t);if(t<1)requestAnimationFrame(moveDot);else scene.remove(dot)}moveDot();setTimeout(()=>{scene.remove(beam);geometry.dispose();material.dispose();scene.remove(dot);dot.geometry.dispose();dot.material.dispose()},420)}function showDamage(d){if(!scene)return;const el=document.createElement('div');el.className='damage';el.textContent='-'+d.damage;$('#hud').appendChild(el);damageFloats.push({el,pos:new THREE.Vector3(d.x,d.y,d.z),until:performance.now()+950});if(d.by===socket.id){const flash=$('#hitflash');flash.textContent='HIT  -'+d.damage;setTimeout(()=>{if(flash.textContent==='HIT  -'+d.damage)flash.textContent=''},700)}}
socket.on('fps:bullet',showBullet);socket.on('fps:hit',showDamage);socket.on('fps:state',s=>sync(s.players));socket.on('fps:joined',d=>{room=d.room;$('#msg').textContent='接続しました';$('#stat').textContent='ROOM '+room});socket.on('fps:error',e=>$('#msg').textContent=e);socket.on('fps:hit',d=>{if(d.id===socket.id){$('#hp').textContent=d.hp;$('#hbar').style.width=d.hp+'%';if(d.hp<=0)$('#stat').textContent='OUT · 5秒後に復帰'}});
socket.on('connect',()=>$('#msg').textContent='サーバー接続済み · ルームを作成できます');socket.on('disconnect',()=>$('#msg').textContent='サーバーから切断されました。ページを再読み込みしてください');socket.on('connect_error',e=>$('#msg').textContent='接続失敗: '+e.message);
function requestRoom(event,payload){$('#msg').textContent='接続を確認中…';if(!socket.connected){socket.connect();$('#msg').textContent='サーバー未接続です。接続中…';return}socket.timeout(6000).emit(event,payload,(err,r)=>{if(err){$('#msg').textContent='サーバー応答がありません。通信または接続先を確認してください';return}if(r?.ok){room=r.room;begin()}else $('#msg').textContent=r?.error||'ルームを作成できませんでした'})}$('#create').onclick=()=>requestRoom('fps:create',{name:$('#name').value,weapon});$('#join').onclick=()=>requestRoom('fps:join',{room:$('#code').value,name:$('#name').value,weapon});function begin(){overlay.classList.add('gone');build();if(pendingState)sync(pendingState);socket.emit('fps:state:get',{room});}
function updateHud(){$('#ammo').textContent=ammo+' / '+maxAmmo}function shoot(){if(!me||dead||reloading||ammo<=0||performance.now()-fireTimer<specs[weapon].rate)return;fireTimer=performance.now();ammo--;updateHud();socket.emit('fps:shoot',{room,weapon,x:camera.position.x,y:camera.position.y,z:camera.position.z,dx:-Math.sin(yaw)*Math.cos(pitch),dy:Math.sin(pitch),dz:-Math.cos(yaw)*Math.cos(pitch)});if(ammo===0)setTimeout(reload,450)}function reload(){if(reloading||ammo===maxAmmo)return;reloading=true;$('#reload').classList.add('active');setTimeout(()=>{ammo=maxAmmo;reloading=false;$('#reload').classList.remove('active');updateHud()},weapon==='SR'?1450:1100)}$('#fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot();if(weapon==='AR'){let t=setInterval(()=>{if(!$('#fire').matches(':active'))clearInterval(t);else shoot()},specs.AR.rate)}});function toggleCrouch(){crouch=!crouch;$('#crouch').classList.toggle('active',crouch);socket.emit('fps:move',{room,crouch})}$('#reload').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reload()});$('#crouch').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleCrouch()});
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')shoot();if(e.key.toLowerCase()==='r')reload();if(e.key.toLowerCase()==='c')toggleCrouch()});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('pointerdown',e=>{if(!overlay.classList.contains('gone')||e.target.closest('.controls'))return;if(e.clientX>innerWidth*.48){look={id:e.pointerId,x:e.clientX,y:e.clientY};document.body.setPointerCapture?.(e.pointerId)}});document.addEventListener('pointermove',e=>{if(look?.id===e.pointerId){yaw-=(e.clientX-look.x)*.006;pitch=Math.max(-1.25,Math.min(1.25,pitch-(e.clientY-look.y)*.005));look.x=e.clientX;look.y=e.clientY}});document.addEventListener('pointerup',e=>{if(look?.id===e.pointerId)look=null});let leftId=null,leftStart=null;document.addEventListener('pointerdown',e=>{if(overlay.classList.contains('gone')&&e.clientX<innerWidth*.46&&!e.target.closest('.controls')){leftId=e.pointerId;const stick=e.target.closest('#stick'),rect=stick?.getBoundingClientRect();leftStart=stick?{x:rect.left+rect.width/2,y:rect.top+rect.height/2}:{x:e.clientX,y:e.clientY};if(stick)stick.setPointerCapture(e.pointerId)}});document.addEventListener('pointermove',e=>{if(e.pointerId===leftId){joy.x=Math.max(-1,Math.min(1,(e.clientX-leftStart.x)/42));joy.y=Math.max(-1,Math.min(1,(e.clientY-leftStart.y)/42));document.querySelector('#knob').style.transform=`translate(calc(-50% + ${joy.x*34}px),calc(-50% + ${joy.y*34}px))`}});document.addEventListener('pointerup',e=>{if(e.pointerId===leftId){leftId=null;joy.x=joy.y=0;document.querySelector('#knob').style.transform='translate(-50%,-50%)'}});
let sendAt=0;function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(camera&&me){let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y, side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;let speed=crouch?2.1:4;let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*side)*speed*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*side)*speed*dt,nx=Math.max(-29,Math.min(29,camera.position.x+dx)),nz=Math.max(-29,Math.min(29,camera.position.z+dz));if(!blocked(nx,camera.position.z))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz;camera.position.y=crouch?1.05:1.65;camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);if(performance.now()-sendAt>80){socket.emit('fps:move',{room,x:camera.position.x,z:camera.position.z,yaw,crouch});sendAt=performance.now()}}if(camera){const now=performance.now();damageFloats=damageFloats.filter(f=>{if(now>f.until){f.el.remove();return false}const v=f.pos.clone().project(camera),onScreen=v.z>-1&&v.z<1;f.el.style.display=onScreen?'block':'none';f.el.style.left=((v.x+1)*innerWidth/2)+'px';f.el.style.top=((1-v.y)*innerHeight/2-22)+'px';f.el.style.opacity=String(Math.max(0,(f.until-now)/950));return true})}if(renderer)renderer.render(scene,camera)}
window.addEventListener('error',e=>{overlay.classList.remove('gone');$('#msg').textContent='画面エラー: '+(e.message||'3D画面を開始できません')+'。Three.js CDNへの接続とWebGLを確認してください。';console.error(e.error||e.message)});
})();</script></body></html>
