name: Deploy sunsun to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'sunsun-firebase-deploy/**'
      - '.github/workflows/deploy-sunsun-firebase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting (sunsun-66597)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUNSUN_66597 }}
          projectId: sunsun-66597
          channelId: live
          entryPoint: sunsun-firebase-deploy
