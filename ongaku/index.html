<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習シート</title>
  <style>
    :root {
      --bg: #f0f5fa;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      color: var(--primary-dark);
    }
    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }
    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 8px;
      margin: 0 -8px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .tab-group {
      flex: 0 0 auto;
      padding: 0 4px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .tab {
      flex: 0 0 auto;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 8px 13px;
      background: #eff6ff;
      color: var(--primary-dark);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .tab:hover, .tab:focus-visible {
      border-color: #93c5fd;
      outline: none;
    }
    .tab[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }
    .viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 176px);
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .viewer { height: calc(100vh - 156px); min-height: 360px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>学習シート</h1>
    <p class="lead">タブを選ぶと、下に教材が表示されます。左右にスクロールできます。</p>
    <nav class="tabs" aria-label="学習シートと教科別教材">
      <span class="tab-group">学習シート</span>
      <button class="tab" type="button" aria-pressed="true" data-src="https://inovation-design.github.io/aa/">学習シートまとめ（全9教材）</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./ongaku-guitar.html">音楽・楽典＆ギター</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./hoken.html">保健</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./hoken-yougo.html">保健用語</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./bijutsu.html">美術</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./shodo.html">書道</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./ise-akutagawa.html">伊勢物語・芥川</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./kobun-tango-041-100.html">古文単語 041〜100</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html">期末テスト保存版</button>
      <button class="tab" type="button" aria-pressed="false" data-src="https://inovation-design.github.io/reibun/">英語例文（第19〜25章）</button>
      <button class="tab" type="button" aria-pressed="false" data-src="https://inovation-design.github.io/sunsun/">保健（単元08〜18）</button>
      <span class="tab-group">教科別</span>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t0&amp;embed=1">漢文 白文</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t1&amp;embed=1">漢文 句法</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t2&amp;embed=1">英語 例文</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t3&amp;embed=1">地理総合</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t4&amp;embed=1">歴史総合</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t5&amp;embed=1">生物基礎</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t6&amp;embed=1">生物 実践</button>
      <button class="tab" type="button" aria-pressed="false" data-src="./term-test.html?tab=t7&amp;embed=1">家庭基礎</button>
    </nav>
    <iframe class="viewer" id="study-view" src="https://inovation-design.github.io/aa/" title="学習シートまとめ（全9教材）"></iframe>
  </main>
  <script>
    const viewer = document.getElementById('study-view');
    const tabs = document.querySelectorAll('.tab');

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        viewer.src = tab.dataset.src;
        viewer.title = tab.textContent.trim();
        tabs.forEach((item) => item.setAttribute('aria-pressed', 'false'));
        tab.setAttribute('aria-pressed', 'true');
      });
    });
  </script>
</body>
</html>
